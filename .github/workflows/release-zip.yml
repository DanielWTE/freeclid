name: Build release ZIP

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build freeclid.zip
          mkdir -p build/freeclid

          cp -R \
            assets \
            includes \
            freeclid.php \
            readme.txt \
            README.md \
            LICENSE \
            build/freeclid/

          cd build
          zip -r ../freeclid.zip freeclid

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: freeclid
          path: freeclid.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" freeclid.zip --clobber
          else
            gh release create "$TAG_NAME" freeclid.zip \
              --title "FreeCLID $TAG_NAME" \
              --notes "Download freeclid.zip and upload it in WordPress under Plugins > Add New > Upload Plugin."
          fi
